name: GLaDOS 自动签到

# 定时策略（北京时间）：
#   账号1 —— 每天 00:20 触发后随机延迟 0~30 分钟签到
#   账号2 —— 每天 17:00 触发后随机延迟签到（与账号1错开时间与请求指纹）
#   手动触发（workflow_dispatch）立即执行、不加延迟，用于测试
on:
  schedule:
    - cron: '20 16 * * *'   # 北京 00:20 —— 账号1
    - cron: '0 9 * * *'     # 北京 17:00 —— 账号2
  workflow_dispatch: {}

permissions:
  contents: write           # keepalive-workflow 需要提交保活 commit

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 签到（${{ matrix.account }}）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 账号1
            secret: GLADOS_COOKIE_1
            schedule: '20 16 * * *'
          - account: 账号2
            secret: GLADOS_COOKIE_2
            schedule: '0 9 * * *'
    steps:
      # 注意：job 级 if 不支持 matrix 上下文，班次判断必须放在步骤级
      - name: 班次判断
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "${{ matrix.schedule }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "命中班次：${{ matrix.account }}（${{ matrix.schedule }}）"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "非 ${{ matrix.account }} 的班次，跳过本次运行"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.gate.outputs.run == 'true'
        run: pip install "requests>=2.28"   # Actions 只用 requests 模式，不装本地浏览器模式的 selenium/playwright

      # 模拟真人作息：定时运行时随机睡 0~29 分钟；手动测试立即执行
      - name: 随机延迟
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          D=$((RANDOM % 30))
          echo "随机延迟 ${D} 分钟"
          sleep $((D * 60))

      - name: 签到（${{ matrix.account }}）
        id: checkin
        if: steps.gate.outputs.run == 'true'
        env:
          GLADOS_COOKIE: ${{ secrets[matrix.secret] }}
          GLADOS_BASE_URL: ${{ secrets.GLADOS_BASE_URL }}
          GLADOS_CHECKIN_TOKEN: ${{ secrets.GLADOS_CHECKIN_TOKEN }}
        run: |
          if [ -z "$GLADOS_COOKIE" ]; then
            if [ "${{ matrix.secret }}" = "GLADOS_COOKIE_2" ]; then
              echo "⏭️ 未配置 GLADOS_COOKIE_2 —— 当前只启用账号1，跳过（属正常，配置 Secret 后自动启用）"
              echo "| ${{ matrix.account }} | ⏭️ 跳过（未配置 Secret） |" >> $GITHUB_STEP_SUMMARY
              echo "result=skipped" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "❌ 缺少 secret ${{ matrix.secret }}"
            echo "请到仓库 Settings → Secrets and variables → Actions → New repository secret 添加"
            exit 1
          fi
          python - <<'PYEOF'
          import json, os
          base = (os.environ.get("GLADOS_BASE_URL") or "https://glados.rocks").rstrip("/")
          token = os.environ.get("GLADOS_CHECKIN_TOKEN") or "glados.one"
          cfg = {
              "mode": "requests",
              "checkin_page": f"{base}/console/checkin",
              "cookie": os.environ["GLADOS_COOKIE"],
              "checkin_post_url": f"{base}/api/user/checkin",
              "post_json": {"token": token},
          }
          with open("config_runtime.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("签到地址:", cfg["checkin_post_url"])
          PYEOF
          python auto_checkin.py -c config_runtime.json && echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: 写成功摘要
        if: always() && steps.checkin.outputs.result == 'ok'
        run: echo "| ${{ matrix.account }} | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY

      - name: 写失败摘要
        if: always() && steps.checkin.outcome == 'failure'
        run: echo "| ${{ matrix.account }} | ❌ 失败（详情见上方日志） |" >> $GITHUB_STEP_SUMMARY

      # 仓库 60 天无活动时 GitHub 会自动停用定时任务；距上次提交超 50 天时自动提交空 commit 保活。
      # 纯官方实现（只用 git），不引用任何第三方 Action
      - name: 保活（防止定时任务被停用）
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST) / 86400 ))
          if [ "$AGE" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive（防止定时任务被停用）[skip ci]"
            git push
          else
            echo "距上次提交 ${AGE} 天，未达 50 天阈值，无需保活"
          fi
